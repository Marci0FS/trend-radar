# Mots-cles a surveiller en mode "veille continue" (python cli.py scan).
# category regroupe les mots-cles par theme, utile pour cibler des
# subreddits pertinents plutot que chercher sur tout Reddit.

categories:
  gadgets:
    keywords:
      - "led face mask"
      - "posture corrector"
    subreddits:
      - gadgets
      - shutupandtakemymoney
  home:
    keywords:
      - "air purifier plant"
    subreddits:
      - BuyItForLife
      - HomeImprovement

# Fenetre Google Trends (format pytrends, ex: "today 3-m", "today 12-m")
trends_timeframe: "today 3-m"
trends_geo: "FR"

# Fenetre Reddit (praw time_filter: hour/day/week/month/year/all)
reddit_time_filter: "month"
reddit_post_limit: 25

# Seuils de detection par source (au-dela = "signal positif" pour cette source)
thresholds:
  trends_growth_pct: 20
  reddit_min_posts: 3
  reddit_min_avg_score: 10
