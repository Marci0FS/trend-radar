# Mots-cles a surveiller en mode "veille continue" (python cli.py scan).
# category regroupe les mots-cles par theme, utile pour cibler des
# subreddits pertinents plutot que chercher sur tout Reddit.

categories:
  gadgets:
    keywords:
      - "purificateur d'air portable"
      - "mini projecteur"
      - "montre connectee sante"
      - "chargeur solaire portable"
    subreddits:
      - gadgets
      - shutupandtakemymoney
  beaute:
    keywords:
      - "masque LED visage"
      - "brosse a dents electrique sonique"
      - "huile de ricin cheveux"
    subreddits:
      - SkincareAddiction
      - beauty
  maison:
    keywords:
      - "lampe de sel himalayen"
      - "diffuseur huiles essentielles"
      - "robot aspirateur laveur"
    subreddits:
      - BuyItForLife
      - HomeImprovement
  fitness:
    keywords:
      - "ceinture de sudation"
      - "corde a sauter connectee"
    subreddits:
      - fitness
      - xxfitness
  animaux:
    keywords:
      - "fontaine a eau chat"
      - "GPS collier chien"
    subreddits:
      - cats
      - dogs
  enfants:
    keywords:
      - "veilleuse projecteur enfant"
      - "tapis puzzle bebe"
    subreddits:
      - Mommit
      - beyondthebump

# Fenetre Google Trends (format pytrends, ex: "today 3-m", "today 12-m")
trends_timeframe: "today 3-m"
trends_geo: "FR"
ebay_marketplace: "EBAY_FR"
aliexpress_ship_to: "FR"
aliexpress_currency: "EUR"
aliexpress_language: "fr"

# Fenetre Reddit (praw time_filter: hour/day/week/month/year/all)
reddit_time_filter: "month"
reddit_post_limit: 25

# Seuils de detection par source (au-dela = "signal positif" pour cette source)
thresholds:
  trends_growth_pct: 20
  reddit_min_posts: 3
  reddit_min_avg_score: 10
  ebay_growth_pct: 20
  aliexpress_growth_pct: 20
  youtube_growth_pct: 20

# Configuration du mode discovery (python cli.py discover) — detecte des
# candidats sans mots-cles fournis a l'avance, a partir de l'activite Reddit.
discovery:
  subreddits:
    # subreddits deja cibles par categorie (reutilises)
    - gadgets
    - shutupandtakemymoney
    - SkincareAddiction
    - beauty
    - BuyItForLife
    - HomeImprovement
    - fitness
    - xxfitness
    - cats
    - dogs
    - Mommit
    - beyondthebump
    # subreddits generalistes "produits tendance", hors categories
    - DidntKnowIWantedThat
    - InternetIsBeautiful
    - CoolGadgets
    - ProductPorn
  post_limit: 50
  min_mentions: 5
  min_growth_pct: 30
